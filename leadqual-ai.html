<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadQual AI – B2B enquiry qualification (student prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--panel:#f5f7fb;--ink:#17202f;--muted:#5a6a82;--line:#e1e7f0;
  --navy:#14284b;--navy2:#1f3a6e;--on-navy:#ffffff;
  --green:#23915f;--green-soft:#e4f4ec;--green-ink:#17694436;
  --warn:#9a6212;--warn-soft:#fdf1d8;--bad:#a93229;--bad-soft:#fbe8e6;--info-soft:#e8eefb;
  --shadow:0 1px 2px rgba(20,40,75,.06),0 4px 14px rgba(20,40,75,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1626;--panel:#142038;--ink:#e8edf6;--muted:#9fb0c9;--line:#26354f;
    --navy:#0b1730;--navy2:#3e63b0;--on-navy:#ffffff;
    --green:#4cc28c;--green-soft:#123a2b;--warn:#f0b955;--warn-soft:#3a2d12;--bad:#ff8b80;--bad-soft:#3d1a18;--info-soft:#172a4d;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1626;--panel:#142038;--ink:#e8edf6;--muted:#9fb0c9;--line:#26354f;
  --navy:#0b1730;--navy2:#3e63b0;--on-navy:#ffffff;
  --green:#4cc28c;--green-soft:#123a2b;--warn:#f0b955;--warn-soft:#3a2d12;--bad:#ff8b80;--bad-soft:#3d1a18;--info-soft:#172a4d;
  --shadow:none;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;color:var(--ink)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.98rem;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
header.top{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:.72rem;opacity:.75;margin-top:-2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#cdd8ee;padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
nav.tabs button[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 -2px 0 var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.banner{background:var(--info-soft);border-bottom:1px solid var(--line);font-size:.85rem}
.banner div{max-width:1240px;margin:0 auto;padding:8px 20px;color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--muted);margin-top:4px;max-width:68ch}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:.82rem}
.kpi .v{font-size:1.75rem;font-weight:700;color:var(--navy);margin:2px 0}
:root[data-theme="dark"] .kpi .v{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .v{color:#fff}}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.good{border-left:4px solid var(--green)}
.kpi.warn{border-left:4px solid #d9a441}
.kpi.navy{border-left:4px solid var(--navy2)}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:550}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--navy2);border-color:transparent}
:root[data-theme="dark"] .chip.info{color:#a9c2f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.info{color:#a9c2f5}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);background:var(--panel);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.row{cursor:pointer}
.tbl tbody tr.row:hover{background:var(--panel)}
.tbl .idbtn{background:none;border:0;padding:0;color:var(--navy2);font-weight:650;cursor:pointer;text-decoration:underline}
:root[data-theme="dark"] .tbl .idbtn{color:#a9c2f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tbl .idbtn{color:#a9c2f5}}
.clip{max-width:260px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
form .row2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
form .row3{display:grid;gap:14px;grid-template-columns:2fr 1fr 1fr}
@media(max-width:640px){form .row2,form .row3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=number],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.req{color:var(--bad)}
.examples{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 28px;gap:10px;align-items:center;font-size:.85rem}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--panel)}
.bar i{display:block;height:100%}
.seg-q{background:var(--green)}.seg-n{background:#e0a93a}.seg-i{background:#c4504a}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.conf{display:inline-block;width:70px;height:7px;border-radius:5px;background:var(--panel);border:1px solid var(--line);vertical-align:middle;overflow:hidden}
.conf i{display:block;height:100%;background:var(--green)}
.conf.mid i{background:#d9a441}.conf.low i{background:#c4504a}
.status-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:16px}
.status-banner.ok{background:var(--green-soft)}.status-banner.warn{background:var(--warn-soft)}.status-banner.bad{background:var(--bad-soft)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.9rem}
@media(max-width:520px){.kv{grid-template-columns:1fr}}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.q .why{font-size:.84rem;color:var(--muted);margin-top:3px}
.match{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
pre.json{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:.8rem;max-height:420px;font-family:ui-monospace,Menlo,Consolas,monospace}
details summary{cursor:pointer;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text]{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 190px;min-width:0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:14px;padding:20px;max-width:480px;width:100%;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:0 0 12px 18px;border-left:2px solid var(--line);position:relative;font-size:.86rem}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.statusbtns{display:flex;gap:6px;flex-wrap:wrap}
.statusbtns .btn[aria-pressed="true"]{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.cmp td:nth-child(2){color:var(--muted)}
.diff{background:var(--green-soft)}
.note{font-size:.84rem;color:var(--muted)}
.sec{margin-bottom:22px}
.sec > h2{margin-bottom:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{font-size:.82rem;color:var(--muted)}
.stat.g{border-left:4px solid var(--green)}.stat.w{border-left:4px solid #d9a441}
.todo{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo > div:last-child{display:flex;gap:8px;align-items:center;flex-shrink:0}
@media(max-width:560px){.todo{flex-direction:column;align-items:flex-start}}
.narrow{max-width:720px}
.btn.big{padding:12px 22px;font-size:1rem}
.more{margin:4px 0 8px}.more summary{color:var(--navy2);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--navy2);cursor:pointer;text-decoration:underline;font:inherit}
:root[data-theme="dark"] .linkbtn{color:#a9c2f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .linkbtn{color:#a9c2f5}}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-bottom:3px solid transparent}
.tabs2 button span{background:var(--panel);border-radius:99px;padding:0 7px;font-size:.78rem;margin-left:3px}
.tabs2 button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-bottom:6px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.field .hint{margin-top:-1px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
    <span>LeadQual AI<small>Enquiry verification and qualification</small></span>
  </div>
  <nav class="tabs" id="nav" aria-label="Screens"></nav>
</div></header>
<main id="app" tabindex="-1"></main>
<div id="overlay"></div><div id="modal"></div><div id="toast"></div>

<script>
(function(){
'use strict';
/* ================= config & helpers ================= */
const KEY='leadqual_ai_demo_v1';
const AI_ENDPOINT=''; // Set to a server-side function URL that returns the same JSON schema. Empty = rule-based demo mode. Never put API keys in this file.
const STATUSES=['New','Awaiting clarification','Ready for review','Accepted','Quotation sent','Converted','Rejected'];
const REJECT_REASONS=['Wrong product','Insufficient quantity','Location mismatch','Budget mismatch','Other'];
const FIELDS=['product','quantity','unit','location','timeline','specs','use_case','budget'];
const REQUIRED=['product','quantity','unit','location','timeline','specs','use_case'];
const LABEL={product:'Product / service',quantity:'Quantity',unit:'Unit',location:'Delivery location',timeline:'Purchase timeline',specs:'Specifications',use_case:'Business use case',budget:'Budget (optional)'};
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(t,max)=>String(t==null?'':t).replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,max||500);
const num=s=>parseFloat(String(s).replace(/,/g,''));
const title=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const fmtDate=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtDT=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ================= taxonomy & sample supplier catalogue ================= */
const CATS=[
 {id:'crushing',label:'Crushing & screening',kw:['jaw crusher','cone crusher','impact crusher','vsi','crusher','vibrating screen','screening plant','aggregate plant'],spec:'What capacity (TPH), feed material and final product size do you need?'},
 {id:'conveyor',label:'Conveyors & handling',kw:['belt conveyor','conveyor','idler','hopper','feeder'],spec:'What belt width, length, material and capacity are needed?'},
 {id:'cnc',label:'CNC & machine tools',kw:['cnc','vmc','hmc','lathe','milling','machining centre'],spec:'How many axes, what table or bed size, and which materials will you machine?'},
 {id:'pumps',label:'Pumps & motors',kw:['centrifugal pump','submersible','pump','motor'],spec:'What flow rate, head, fluid and power rating are required?'},
 {id:'solar',label:'Solar equipment',kw:['solar panel','solar inverter','solar','inverter','pv'],spec:'What capacity (kW) and type, and is it rooftop or ground mounted?'},
 {id:'steel',label:'Steel & metals',kw:['tmt','rebar','steel pipe','ms pipe','erw','steel','gi sheet','pipe'],spec:'Which grade, size or thickness and standard do you need?'},
 {id:'packaging',label:'Packaging',kw:['corrugated','carton','packaging','pouch','boxes','box'],spec:'What dimensions, ply or material, and printing are required?'},
 {id:'textile',label:'Textiles & yarn',kw:['fabric','yarn','cotton','textile','polyester'],spec:'What count or GSM, composition and width do you need?'}
];
const GENERIC=['machine','machinery','equipment','material','product','item','goods','parts','steel','pump','motor','box','fabric','pipe','crusher','screen','conveyor','solar','inverter'];
const SUPPLIERS=[
 {id:'S01',name:'Shakti Crushers & Screens',cat:'crushing',terms:['jaw','cone','vibrating','crusher','screen'],states:['Rajasthan','Gujarat','Madhya Pradesh'],moq:[1,'units']},
 {id:'S02',name:'Deccan Aggregate Machinery',cat:'crushing',terms:['jaw','impact','vsi','aggregate'],states:['Karnataka','Telangana','Tamil Nadu','Maharashtra'],moq:[1,'units']},
 {id:'S03',name:'Himalaya Crusher Plants',cat:'crushing',terms:['jaw','cone','crusher','screen'],states:['Punjab','Uttar Pradesh','Delhi','Haryana'],moq:[1,'units']},
 {id:'S04',name:'Nirmal Conveyors India',cat:'conveyor',terms:['belt','conveyor','idler'],states:['*'],moq:[50,'meters']},
 {id:'S05',name:'Vega Material Handling',cat:'conveyor',terms:['conveyor','hopper','feeder'],states:['Maharashtra','Karnataka','Chhattisgarh'],moq:[1,'units']},
 {id:'S06',name:'Precision Axis CNC Works',cat:'cnc',terms:['cnc','vmc','lathe','milling'],states:['Gujarat','Maharashtra','Tamil Nadu'],moq:[1,'units']},
 {id:'S07',name:'AquaFlow Pumps & Motors',cat:'pumps',terms:['pump','centrifugal','submersible','motor'],states:['*'],moq:[1,'units']},
 {id:'S08',name:'SunGrid Renewables',cat:'solar',terms:['solar','panel','inverter'],states:['Gujarat','Maharashtra','Rajasthan','Karnataka'],moq:[1,'units']},
 {id:'S09',name:'Bharat TMT & Alloys',cat:'steel',terms:['tmt','rebar','steel','pipe'],states:['*'],moq:[5,'tons']},
 {id:'S10',name:'Coastal Steel Traders',cat:'steel',terms:['pipe','steel','erw','tmt'],states:['Tamil Nadu','Kerala','Karnataka'],moq:[2,'tons']},
 {id:'S11',name:'PackRight Corrugation',cat:'packaging',terms:['corrugated','box','carton'],states:['Maharashtra','Gujarat','Karnataka'],moq:[500,'pieces']},
 {id:'S12',name:'Surat Weave Textiles',cat:'textile',terms:['fabric','cotton','yarn'],states:['Gujarat','Maharashtra','Rajasthan'],moq:[500,'meters']}
];
const CITY_STATE={Mumbai:'Maharashtra',Pune:'Maharashtra',Nagpur:'Maharashtra',Delhi:'Delhi',Bengaluru:'Karnataka',Chennai:'Tamil Nadu',Coimbatore:'Tamil Nadu',Hyderabad:'Telangana',Ahmedabad:'Gujarat',Surat:'Gujarat',Rajkot:'Gujarat',Vadodara:'Gujarat',Kolkata:'West Bengal',Jaipur:'Rajasthan',Indore:'Madhya Pradesh',Bhopal:'Madhya Pradesh',Lucknow:'Uttar Pradesh',Ludhiana:'Punjab',Kochi:'Kerala',Raipur:'Chhattisgarh',Maharashtra:'Maharashtra',Gujarat:'Gujarat',Rajasthan:'Rajasthan',Karnataka:'Karnataka','Tamil Nadu':'Tamil Nadu',Telangana:'Telangana','Uttar Pradesh':'Uttar Pradesh',Punjab:'Punjab',Kerala:'Kerala',Odisha:'Odisha',Chhattisgarh:'Chhattisgarh','Madhya Pradesh':'Madhya Pradesh',Haryana:'Haryana'};
const LOC_LIST=Object.keys(CITY_STATE).concat(['Bangalore']).sort((a,b)=>b.length-a.length);
function normLoc(t){const s=String(t||'').toLowerCase();for(const l of LOC_LIST){if(new RegExp('\\b'+l.toLowerCase()+'\\b').test(s))return l==='Bangalore'?'Bengaluru':l;}return null;}
const stateOf=l=>CITY_STATE[l]||null;

/* ================= unit & text parsing (rule-based) ================= */
const UNITMAP={unit:'units',units:'units',no:'units',nos:'units',pcs:'pieces',piece:'pieces',pieces:'pieces',set:'sets',sets:'sets',ton:'tons',tons:'tons',tonne:'tons',tonnes:'tons',mt:'tons',kg:'kg',kgs:'kg',kilogram:'kg',kilograms:'kg',metre:'meters',metres:'meters',meter:'meters',meters:'meters',roll:'rolls',rolls:'rolls',box:'boxes',boxes:'boxes',carton:'cartons',cartons:'cartons',litre:'litres',litres:'litres',liter:'litres',liters:'litres',panel:'panels',panels:'panels',machine:'units',machines:'units',pump:'units',pumps:'units',light:'units',lights:'units'};
const UNIT_OPTS=['units','pieces','sets','tons','kg','meters','rolls','boxes','cartons','litres','panels'];

const SPEC_B=/\b\d+\s?x\s?\d+(?:\s?x\s?\d+)?\s?(?:mm|cm|inch|in|ft)?\b/gi;
const SPEC_C=/\b(?:ss\s?3\d\d|fe\s?\d{3}d?|mild steel|stainless steel|hdpe|pvc|cast iron|manganese|aluminium|aluminum|polyester|mono\s?perc|bifacial|on-grid|off-grid|erw|\d+s cotton)\b/gi;
function parseTimeline(t){

  if((m=s.match(/\bwithin\s+(\d+)\s*(day|week|month)s?/)))return 'Within '+m[1]+' '+m[2]+(m[1]==='1'?'':'s');
  if((m=s.match(/\bin\s+(\d+)\s*(day|week|month)s?\b/)))return 'In '+m[1]+' '+m[2]+(m[1]==='1'?'':'s');
  if((m=s.match(/\b(this|next)\s+(week|month|quarter)\b/)))return title(m[1]+' '+m[2]);

}
function parseBudget(t){

function parseText(text){
  const t=clean(text,2000),out={};let m;

  out.budget=parseBudget(t);
  const sp=[];[SPEC_A,SPEC_B,SPEC_C].forEach(r=>{(t.match(r)||[]).forEach(x=>{const v=x.trim();if(!sp.some(y=>y.toLowerCase()===v.toLowerCase()))sp.push(v);});});

}
function inferCategory(text){
  const s=String(text||'').toLowerCase();let best=null;

}
const catLabel=id=>(CATS.find(c=>c.id===id)||{label:'Uncategorised'}).label;
const INJECTION=/ignore (all |any )?(previous|prior|above)|system prompt|you are now|disregard (the )?(rules|instructions)|reveal .{0,20}(key|prompt)|<\s*script/i;

/* ================= extraction + qualification engine ================= */
const CONF={form:0.95,text:0.8,answer:0.92,edited:1,none:0};
function setExt(enq,f,v,src){const empty=v==null||v==='';enq.ext[f]={value:empty?null:v,confidence:empty?0:CONF[src],source:empty?'none':src};}
function sanitizeRaw(r){

}
function extract(raw){
  const enq={ext:{}},tx=parseText(raw.text);
  const catAll=inferCategory(raw.product+' '+raw.text);
  let product=raw.product,psrc='form';
  if(!product&&catAll&&catAll.kw){product=title(catAll.kw);psrc='text';}
  else if(product&&GENERIC.includes(product.toLowerCase())&&catAll&&catAll.kw&&catAll.kw.length>product.length&&catAll.kw.indexOf(product.toLowerCase())>-1){product=title(catAll.kw);psrc='text';}
  setExt(enq,'product',product,psrc);
  const hasQ=raw.qty!==''&&!isNaN(raw.qty)&&raw.qty>0;
  setExt(enq,'quantity',hasQ?raw.qty:tx.qty,hasQ?'form':'text');
  const fu=canon(raw.unit);setExt(enq,'unit',fu||tx.unit,fu?'form':'text');
  setExt(enq,'location',normLoc(raw.location)||raw.location||tx.location,raw.location?'form':'text');
  setExt(enq,'timeline',raw.timeline||tx.timeline,raw.timeline?'form':'text');
  setExt(enq,'specs',tx.specs,'text');
  setExt(enq,'use_case',raw.useCase||tx.use_case,raw.useCase?'form':'text');
  if(enq.ext.use_case.source==='text')enq.ext.use_case.confidence=0.55;
  if(enq.ext.specs.source==='text')enq.ext.specs.confidence=0.65;
  if(enq.ext.timeline.source==='text')enq.ext.timeline.confidence=0.7;
  setExt(enq,'budget',raw.budget||tx.budget,raw.budget?'form':'text');
  return enq.ext;
}
function detectMismatches(raw){
  const tx=parseText(raw.text),out=[];
  const hasQ=raw.qty!==''&&!isNaN(raw.qty)&&raw.qty>0;
  if(hasQ&&tx.qty&&tx.qty!==raw.qty)out.push({field:'quantity',form_value:String(raw.qty),text_value:String(tx.qty),message:'Form quantity ('+raw.qty+') differs from the description ('+tx.qty+').'});
  const fu=canon(raw.unit);
  if(fu&&tx.unit&&fu!==tx.unit&&!(COUNT.includes(fu)&&COUNT.includes(tx.unit)))out.push({field:'unit',form_value:fu,text_value:tx.unit,message:'Form unit ('+fu+') differs from the description ('+tx.unit+').'});
  const fl=normLoc(raw.location);
  if(fl&&tx.location&&fl!==tx.location)out.push({field:'location',form_value:fl,text_value:tx.location,message:'Delivery location in the form ('+fl+') differs from the description ('+tx.location+').'});
  const c1=inferCategory(raw.product),c2=inferCategory(raw.text);
  if(c1&&c2&&c1.id!==c2.id)out.push({field:'product',form_value:raw.product,text_value:title(c2.kw),message:'Product field suggests '+catLabel(c1.id)+' but the description mentions '+catLabel(c2.id)+'.'});

}
const QDEF={
 product:['What product or service do you need?','Sellers are matched by product, so enquiries without one cannot be routed.'],
 quantity:['How many (or how much) do you need?','Sellers need a quantity to check minimum order sizes and to quote.'],
 unit:['In which unit is the quantity (for example units, tons, meters)?','A number without a unit can mean very different orders and prices.'],
 location:['Which city or state should this be delivered to?','Freight, lead time and serviceability depend on location, and many sellers serve only certain regions.'],
 timeline:['When do you need it by?','Urgency decides whether a seller with stock or a shorter lead time is the right fit.'],
 use_case:['What will you use it for?','Knowing the use lets a seller recommend the right model or grade instead of only the cheapest one.']
};
function buildQuestions(missing,mism,cat){
  const qs=[];
  mism.forEach(m=>qs.push({id:m.field+':mismatch',field:m.field,kind:'mismatch',question:m.message+' Which one is correct?',why:'Conflicting details lead sellers to quote the wrong item or quantity.',options:[m.form_value,m.text_value]}));
  const order=['product','quantity','unit','specs','location','timeline','use_case'];
  order.forEach(f=>{
    if(!missing.some(x=>x.field===f))return;
    if(f==='specs'){const c=CATS.find(x=>x.id===cat);qs.push({id:'specs:missing',field:'specs',kind:'missing',question:c?c.spec:'Which specifications matter most (size, capacity, material, standard)?',why:'Specifications are what separate a relevant quote from a generic one.'});}
    else qs.push({id:f+':missing',field:f,kind:'missing',question:QDEF[f][0],why:QDEF[f][1]});
  });

}
function matchSuppliers(enq){
  const e=enq.ext,cat=categoryOf(enq);if(!cat)return[];
  const ptxt=((e.product.value||'')+' '+enq.raw.text).toLowerCase(),loc=e.location.value,st=stateOf(loc);
  const qty=e.quantity.value,unit=e.unit.value;
  return SUPPLIERS.filter(s=>s.cat===cat).map(s=>{
    let score=50;const why=['Category match: '+catLabel(cat)+' (+50)'];
    const hits=s.terms.filter(t=>ptxt.indexOf(t)>-1);
    if(hits.length){score+=15;why.push('Product terms match: '+hits.slice(0,3).join(', ')+' (+15)');}else why.push('No specific product term match (+0)');
    if(!st)why.push('Delivery location unknown, region not scored (+0)');
    else if(s.states[0]==='*'){score+=20;why.push('Serves all India (+20)');}
    else if(s.states.includes(st)){score+=20;why.push('Serves '+st+' (+20)');}
    else why.push('Does not list '+st+' as a served region (+0)');
    if(!qty||!unit)why.push('Quantity or unit unknown, minimum order not checked (+0)');
    else if(s.moq[1]===unit||(COUNT.includes(unit)&&COUNT.includes(s.moq[1]))){if(qty>=s.moq[0]){score+=15;why.push('Meets minimum order of '+s.moq[0]+' '+s.moq[1]+' (+15)');}else why.push('Below minimum order of '+s.moq[0]+' '+s.moq[1]+' (+0)');}
    else why.push('Minimum order is in '+s.moq[1]+', unit differs so it needs checking (+0)');

function categoryOf(enq){const c=inferCategory((enq.ext.product.value||'')+' '+enq.raw.text);return c?c.id:null;}
function qualify(enq){
  const e=enq.ext,missing=[],reasons=[];
  REQUIRED.forEach(f=>{
    const v=e[f].value;
    if(v==null||v==='')missing.push({field:f,label:LABEL[f],reason:'Not provided'});
    else if(f==='product'&&String(v).trim().split(/\s+/).length<=1&&GENERIC.includes(String(v).toLowerCase()))missing.push({field:f,label:LABEL[f],reason:'Too generic to match sellers'});
  });
  const mism=detectMismatches(enq.raw).filter(m=>!enq.confirmed.includes(m.field));
  const cat=categoryOf(enq);
  const prodBad=missing.some(m=>m.field==='product');

  if(status==='qualified')reasons.push('All required details are present and the form agrees with the description.');
  if(missing.length)reasons.push(missing.length+' required detail(s) missing or unclear: '+missing.map(m=>m.label.toLowerCase()).join(', ')+'.');
  if(mism.length)reasons.push(mism.length+' mismatch(es) between the form and the free text.');
  if(enq.flagged)reasons.push('The description contained instruction-like text. It was treated as plain data and ignored.');

  const r={engine_mode:AI_ENDPOINT?'llm':'rule_based_demo',extracted_requirements:ex,missing_fields:missing,clarification_questions:questions,detected_mismatches:mism,qualification_status:status,qualification_reasons:reasons,suggested_next_action:next,supplier_matches:matchSuppliers(enq),category:cat,seller_summary:sellerSummary(enq,missing,mism)};

function sellerSummary(enq,missing,mism){
  const e=enq.ext,p=[];

  if(e.location.value)p.push('deliver to '+e.location.value);
  if(e.timeline.value)p.push('timeline: '+e.timeline.value);
  if(e.specs.value)p.push('specs: '+e.specs.value);
  if(e.use_case.value)p.push('use: '+e.use_case.value);
  if(e.budget.value)p.push('budget: '+e.budget.value);
  let s=p.join('; ')+'.';
  const open=missing.map(m=>m.label.toLowerCase()).concat(mism.map(m=>m.field+' mismatch'));

function validateResult(r){
  const e=[];

  ['missing_fields','clarification_questions','detected_mismatches','qualification_reasons','supplier_matches'].forEach(k=>{if(!Array.isArray(r[k]))e.push(k+' must be an array');});

  if(typeof r.suggested_next_action!=='string')e.push('suggested_next_action must be a string');

async function remoteQualify(enq){
  const res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enquiry:enq.raw})});
  if(!res.ok)throw new Error('AI service returned '+res.status);

let state=null;

function createEnquiry(rawIn,opts){

function setField(enq,f,val,at){
  let v=clean(val,200);

  if(f==='unit'&&v)v=canon(v)||v.toLowerCase();

  if(String(prev==null?'':prev)===String(v==null?'':v))return false;
  enq.corrections.push({field:f,from:prev,to:v,fromSource:prevSrc,at:at||Date.now()});
  setExt(enq,f,v,'edited');if(!enq.confirmed.includes(f))enq.confirmed.push(f);
  return true;
}
function applyAnswer(enq,q,val,at){
  const f=q.field;let v=clean(val,200);if(!v)return false;
  if(f==='quantity'){const m=v.match(/\d[\d,]*(?:\.\d+)?/);if(!m)return false;const um=v.match(new RegExp('\\b'+UNIT_SRC,'i'));if(um&&canon(um[0])&&!enq.ext.unit.value)setExt(enq,'unit',canon(um[0]),'answer');v=num(m[0]);}
  else if(f==='unit'){v=canon(v.split(/\s+/)[0])||v.toLowerCase();}
  else if(f==='location'){v=normLoc(v)||title(v);}
  else if(f==='timeline'){v=parseTimeline(v)||v;}
  setExt(enq,f,v,'answer');if(!enq.confirmed.includes(f))enq.confirmed.push(f);
  enq.answers.push({qid:q.id,field:f,question:q.question,answer:String(v),at:at||Date.now()});
  return true;
}
function afterChange(enq,at){
  enq.result=qualify(enq);
  if(enq.result.qualification_status==='qualified'&&['New','Awaiting clarification'].includes(enq.status))hist(enq,'Ready for review','system','All required details are now present',at);
}

    (x.fix||[]).forEach((f,i)=>setField(enq,f[0],f[1],at+2*H));
    if(x.fix)enq.result=qualify(enq);
    if(x.ans){x.ans.forEach(a=>applyAnswer(enq,{id:a[0]+':missing',field:a[0],question:QDEF[a[0]][0]},a[1],at+5*H));afterChange(enq,at+5*H);}
    x.path.forEach(st=>{hist(enq,st[0],'seller',st[0]==='Rejected'?'Rejected after human review':'Updated by seller',at+st[1]*H);});
    if(x.rej)enq.rejection={reason:x.rej.reason,note:x.rej.note,reviewed:true,at:at+x.path[0][1]*H};
  });
  save();
}

/* ================= metrics ================= */
const DECIDED=['Accepted','Quotation sent','Converted','Rejected'],ACCEPTED=['Accepted','Quotation sent','Converted'];
function metrics(){
  const E=state.enquiries,n=E.length;
  const complete=E.filter(e=>e.result.missing_fields.length===0).length;
  const q=E.filter(e=>e.result.qualification_status==='qualified').length;
  const awaiting=E.filter(e=>e.status==='Awaiting clarification').length;
  const hq=E.filter(e=>e.hadQuestions),hqDone=hq.filter(e=>e.answers.length&&e.result.missing_fields.length===0&&e.result.detected_mismatches.length===0).length;
  const decided=E.filter(e=>DECIDED.includes(e.status)),acc=E.filter(e=>ACCEPTED.includes(e.status)).length;
  const quo=E.filter(e=>['Quotation sent','Converted'].includes(e.status)).length;
  const resp=[];E.forEach(e=>{const h=e.history.find(x=>x.actor==='seller');if(h)resp.push((h.at-e.createdAt)/3600e3);});
  const ai=E.reduce((s,e)=>s+(e.aiExtracted||0),0),corr=E.reduce((s,e)=>s+e.corrections.filter(c=>c.fromSource==='text').length,0);
  return{n,complete,incomplete:n-complete,awaiting,q,hq:hq.length,hqDone,decided:decided.length,acc,quo,
    completeness:pct(complete,n),clar:pct(hqDone,hq.length),acceptance:pct(acc,decided.length),conv:pct(quo,n),
    ttr:resp.length?resp.reduce((a,b)=>a+b,0)/resp.length:null,corrRate:pct(corr,ai),corr,ai,respN:resp.length};
}

function submitEnquiry(){

  if(!clean(raw.product)&&clean(raw.text).length<10){err.textContent='Tell us what you need, even in a few words.';return;}
  if(raw.consent&&raw.contact.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw.contact.email)){err.textContent='That email address does not look right.';return;}
  if(raw.qty!==''&&(isNaN(num(raw.qty))||num(raw.qty)<0)){err.textContent='Quantity must be a positive number.';return;}
  err.textContent='';
  const b=$('#submitBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Checking';

    try{const enq=createEnquiry(raw);if(AI_ENDPOINT)await runEngine(enq);save();go('enquiry',enq.id);toast('Enquiry '+enq.id+' checked');}
    catch(ex){b.disabled=false;b.textContent='Check my enquiry';err.textContent='Something went wrong: '+ex.message+'. Your input is still here, try again.';}

  '<section class="card"><details><summary>Before and after</summary><div class="tablewrap" style="margin-top:10px"><table class="tbl cmp"><thead><tr><th>Field</th><th>First read</th><th>Now</th></tr></thead><tbody>'+cmp+'</tbody></table></div></details><details style="margin-top:10px"><summary>History</summary><ul class="tl" style="margin-top:10px">'+e.history.slice().reverse().map(h=>'<li><b>'+esc(h.to)+'</b> <span class="muted">by '+h.actor+', '+fmtDT(h.at)+'</span>'+(h.note?'<br>'+esc(h.note):'')+'</li>').join('')+'</ul></details><details style="margin-top:10px"><summary>Technical output (JSON)</summary><pre class="json" tabindex="0" style="margin-top:10px">'+esc(JSON.stringify(jsonOut(r),null,2))+'</pre></details></section></div></div>';
}
function jsonOut(r){return{extracted_requirements:r.extracted_requirements,missing_fields:r.missing_fields,clarification_questions:r.clarification_questions,detected_mismatches:r.detected_mismatches,qualification_status:r.qualification_status,qualification_reasons:r.qualification_reasons,suggested_next_action:r.suggested_next_action,supplier_matches:r.supplier_matches};}

/* ---- decisions need a human ---- */
function requestStatus(id,s){
  const e=byId(id);if(!e||e.status===s)return;
  if(s==='Rejected'||s==='Accepted'){
    $('#modal').innerHTML='<div class="modal-wrap" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Confirm decision" data-stop="1"><h2>'+(s==='Rejected'?'Reject '+e.id+'?':'Accept '+e.id+'?')+'</h2><p class="note" style="margin:6px 0 12px">'+esc(e.result.seller_summary)+'</p>'+
    (s==='Rejected'?'<div class="field"><label for="m-reason">Reason</label><select id="m-reason">'+REJECT_REASONS.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label for="m-note">Note <span class="muted" id="m-req"></span></label><input type="text" id="m-note" maxlength="160" placeholder="Optional"></div>':'')+
    '<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px"><input type="checkbox" id="m-ok" style="margin-top:4px"><span>I have reviewed this enquiry myself.</span></label><div id="m-err" class="note" style="color:var(--bad);min-height:18px" role="alert"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn '+(s==='Rejected'?'danger':'green')+'" data-act="confirmStatus" data-id="'+id+'" data-s="'+s+'">'+(s==='Rejected'?'Reject':'Accept')+'</button></div></div></div>';
    const sel=$('#m-reason');if(sel)sel.addEventListener('change',()=>{$('#m-req').textContent=sel.value==='Other'?'(required)':'';});
    return;
  }
  commitStatus(id,s);
}
function commitStatus(id,s,extra){
  const e=byId(id);hist(e,s,'seller',(extra&&extra.note)||'Updated by seller');
  if(extra&&extra.rejection)e.rejection=extra.rejection;else if(s!=='Rejected')e.rejection=null;
  save();toast(e.id+' is now: '+s);render();
}

/* ================= events ================= */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const stop=ev.target.closest('[data-stop]');
  if(stop&&el!==stop&&el.dataset.act==='closeModal'&&el.contains(stop))return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='nav')go(el.dataset.v);
  else if(a==='open')go('enquiry',id);
  else if(a==='tab'){ui.f.tab=el.dataset.t;render();}
  else if(a==='closeModal')$('#modal').innerHTML='';
  else if(a==='status')requestStatus(id,el.dataset.s);
  else if(a==='reset'){if(confirm('Reset to the original demo data? Your enquiries and changes will be removed.')){seed();ui.sel=null;go('overview');toast('Demo data reset');}}
  else if(a==='confirmStatus'){
    const s=el.dataset.s;if(!$('#m-ok').checked){$('#m-err').textContent='Please tick the box to confirm.';return;}
    if(s==='Rejected'){const reason=$('#m-reason').value,note=clean($('#m-note').value,160);if(reason==='Other'&&!note){$('#m-err').textContent='Add a short note for "Other".';return;}
      $('#modal').innerHTML='';commitStatus(id,s,{note:'Rejected after human review: '+reason,rejection:{reason,note,reviewed:true,at:Date.now()}});}
    else{$('#modal').innerHTML='';commitStatus(id,s,{note:'Accepted after human review'});}
  }
  else if(a==='example'){const x=EXAMPLES[+el.dataset.i];$('#f-product').value=x.product;$('#f-text').value=x.text;$('#f-qty').value=x.qty;$('#f-unit').value=x.unit;$('#f-budget').value=x.budget;$('#f-location').value=x.location;$('#f-timeline').value=x.timeline;$('#f-use').value=x.useCase;if(x.qty||x.location)document.querySelector('details.more').open=true;toast('Example filled in. Press "Check my enquiry".');}
  else if(a==='saveFields'){
    const e=byId(id);let n=0;FIELDS.forEach(f=>{const inp=$('#fld-'+f);if(inp&&setField(e,f,inp.value))n++;});
    if(!n){toast('Nothing changed');return;}
    afterChange(e);save();render();toast('Saved. Enquiry re-checked.');
  }
  else if(a==='answers'){
    const e=byId(id);let n=0;
    e.result.clarification_questions.forEach(q=>{const k='ans-'+q.id.replace(':','-');let v='';if(q.kind==='mismatch'){const r=document.querySelector('input[name="'+k+'"]:checked');v=r?r.value:'';}else{const i=$('#'+k);v=i?i.value:'';}
      if(v&&applyAnswer(e,q,v))n++;});
    if(!n){toast('Type an answer first',true);return;}
    afterChange(e);save();render();toast('Answers saved. Enquiry updated.');
  }
});
document.addEventListener('submit',ev=>{if(ev.target.id==='enqForm'){ev.preventDefault();submitEnquiry();}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.filter==='q'){ui.f.q=t.value;updateInbox();}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.filter==='sort'){ui.f.sort=t.value;updateInbox();}
  else if(t.dataset.change==='setstatus'){const v=t.value;t.value='';if(v)requestStatus(t.dataset.id,v);}
  else if(t.id==='f-consent'){$('#contactFields').hidden=!t.checked;}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('#modal').innerHTML='';});

/* ================= boot ================= */
try{state=load();if(!state)seed();}catch(e){seed();}
render();
})();
</script>
</body>
</html>
